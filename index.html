<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Math Cosmos · 数学宇宙</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #030306;
      }
      #app-canvas {
        position: fixed;
        inset: 0;
        display: block;
        cursor: crosshair;
        z-index: 0;
      }
      #callout-canvas {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 1;
      }
      #hud {
        position: fixed;
        left: 24px;
        bottom: 20px;
        z-index: 2;
        font: 11px/1.7 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        color: rgba(216, 180, 254, 0.75);
        text-shadow: 0 0 6px rgba(0, 0, 0, 0.9);
        pointer-events: none;
        user-select: none;
        white-space: pre;
      }
      #hud .hint {
        color: rgba(148, 163, 184, 0.55);
      }
      #crosshair {
        position: fixed;
        left: 50%;
        top: 50%;
        z-index: 2;
        width: 4px;
        height: 4px;
        margin: -2px 0 0 -2px;
        border-radius: 50%;
        background: rgba(216, 180, 254, 0.4);
        pointer-events: none;
      }
      #warp-selector {
        position: fixed;
        right: 24px;
        bottom: 20px;
        z-index: 3;
        width: 286px;
        font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      #warp-selector button {
        cursor: pointer;
        font: inherit;
        border: 1px solid rgba(216, 180, 254, 0.22);
        border-radius: 3px;
        color: #e9e2f7;
        background: rgba(12, 10, 20, 0.78);
        backdrop-filter: blur(8px);
        transition: border-color 160ms, background 160ms;
      }
      #warp-selector button:hover {
        border-color: rgba(216, 180, 254, 0.65);
        background: rgba(45, 30, 65, 0.88);
      }
      .warp-riemann {
        width: 100%;
        padding: 10px 12px;
        margin-bottom: 8px;
        color: #f5eefe !important;
        border-color: rgba(192, 132, 252, 0.55) !important;
        background: linear-gradient(90deg, rgba(126, 34, 206, 0.62), rgba(76, 29, 149, 0.42)) !important;
        box-shadow: 0 0 20px rgba(168, 85, 247, 0.14);
      }
      .warp-row { display: flex; gap: 8px; }
      .warp-row button { flex: 1; padding: 7px 8px; }
      .warp-list {
        max-height: min(56vh, 470px);
        overflow: auto;
        margin-top: 8px;
        padding: 4px;
        border: 1px solid rgba(216, 180, 254, 0.18);
        background: rgba(7, 6, 12, 0.9);
        backdrop-filter: blur(10px);
      }
      .warp-item {
        display: grid;
        grid-template-columns: 8px 1fr;
        width: 100%;
        padding: 7px 8px;
        text-align: left;
        border: 0 !important;
        background: transparent !important;
      }
      .warp-item small {
        grid-column: 2;
        color: rgba(148, 163, 184, 0.58);
        font-size: 9px;
      }
      .warp-group-label {
        padding: 7px 8px 3px;
        color: rgba(216, 180, 254, 0.62);
        font-size: 9px;
        letter-spacing: 0.08em;
        border-top: 1px solid rgba(216, 180, 254, 0.12);
      }
      .warp-list .warp-group-label:first-child { border-top: 0; }
      .entity-dot {
        width: 5px;
        height: 5px;
        margin-top: 5px;
        border-radius: 50%;
        background: var(--entity-color);
        box-shadow: 0 0 8px var(--entity-color);
      }
      #codex-drawer {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        z-index: 5;
        width: min(430px, 92vw);
        padding: 54px 28px 28px;
        overflow: auto;
        color: #e9e2f7;
        background: linear-gradient(135deg, rgba(17, 12, 28, 0.97), rgba(7, 6, 12, 0.96));
        border-left: 1px solid rgba(216, 180, 254, 0.25);
        box-shadow: -20px 0 80px rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(18px);
        transform: translateX(102%);
        transition: transform 260ms ease;
        font: 13px/1.8 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      #codex-drawer.open { transform: translateX(0); }
      .icon-button {
        position: absolute;
        top: 14px;
        right: 16px;
        width: 30px;
        height: 30px;
        color: #d8b4fe;
        background: transparent;
        border: 1px solid rgba(216, 180, 254, 0.28);
        border-radius: 3px;
        cursor: pointer;
        font-size: 20px;
      }
      .codex-kicker { color: rgba(216, 180, 254, 0.5); font-size: 10px; letter-spacing: 0.16em; }
      #codex-drawer h2 { margin: 12px 0 0; font-size: 25px; font-weight: 500; }
      #codex-en { color: rgba(148, 163, 184, 0.65); font-size: 11px; }
      .category-tag {
        display: inline-block;
        margin-top: 18px;
        padding: 2px 8px;
        border: 1px solid;
        border-radius: 2px;
        font-size: 10px;
      }
      .formula {
        margin: 24px -8px;
        padding: 20px 8px;
        overflow-x: auto;
        color: #f3e8ff;
        border-top: 1px solid rgba(216, 180, 254, 0.12);
        border-bottom: 1px solid rgba(216, 180, 254, 0.12);
      }
      #codex-description { color: rgba(226, 232, 240, 0.72); }
      .codex-actions { display: grid; gap: 8px; margin-top: 28px; }
      .codex-actions button, .primary-button, .secondary-button { padding: 9px 12px; cursor: pointer; font: inherit; }
      .primary-button { color: #fff; border: 1px solid #a855f7; background: #6b21a8; border-radius: 3px; }
      .secondary-button { color: #e9d5ff; border: 1px solid rgba(216, 180, 254, 0.28); background: rgba(24, 16, 36, 0.8); border-radius: 3px; }
      #flight-status {
        position: fixed;
        top: 22px;
        left: 50%;
        z-index: 3;
        transform: translateX(-50%);
        color: rgba(216, 180, 254, 0.75);
        font: 10px ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.12em;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="callout-canvas"></canvas>
    <div id="hud"></div>
    <div id="crosshair"></div>
    <div id="flight-status">FREE FLIGHT</div>
    <div id="warp-selector"></div>
    <aside id="codex-drawer" aria-hidden="true"></aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
